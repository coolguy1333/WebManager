# Publish a WebManager release: run the tests on the chosen commit, then tag
# it and create the GitHub release. Start it from the Actions tab
# ("Release" > "Run workflow").
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v1.2.0"
        required: true
      title:
        description: "Release title"
        required: true
      notes:
        description: "Release notes (Markdown)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v1.2.3, not '$TAG'." >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes "$NOTES"
